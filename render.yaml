services:
  - type: web
    name: tweetpy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 dashboard:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tweetpy-db
          property: connectionString
      - key: DB_SSLMODE
        value: require

databases:
  - name: tweetpy-db
    databaseName: twitter
    user: tweetpy
    plan: free

